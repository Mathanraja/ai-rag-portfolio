name: CI

# AIDLC quality gate: run the offline unit-test suite on every push / PR.
# Blocks a merge if the confidence-gating core logic regresses.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # confidence.py is dependency-free (stdlib only), so the core unit tests
      # run without installing the heavy runtime deps (faiss/langchain/shap/...).
      - name: Run unit tests
        run: pytest tests/ -q
